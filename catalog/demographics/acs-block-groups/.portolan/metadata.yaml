title: "ACS Demographics — Block Groups"
description: "Curated demographic, economic, housing and transportation indicators for all 314 census block groups in the City of St. Louis, from the U.S. Census Bureau's American Community Survey (ACS) 2020–2024 5-year estimates. The Census Bureau describes the ACS as \"an ongoing survey that provides vital information on a yearly basis about our nation and its people\" and \"the premier source of detailed information about the nation's people and housing.\" Every indicator ships with its margin of error (`*_moe` — the Census Bureau publishes ACS margins at the 90% confidence level), and the headline medians and rates also carry a coefficient of variation (`*_cv`) so small-area noise can be flagged instead of mapped as if certain: at block-group scale margins are often large (one St. Louis block group's median household income is $76,466 ± $20,097). Derived percentages propagate error with the Census Bureau's own formulas from the ACS Accuracy of the Data documentation; ACS jam values for suppressed estimates are nulls here, never numbers; medians are published as-is and cannot be aggregated to larger areas. Each column's description names the exact ACS table it comes from.

Unlike the city's own datasets in this catalog, this is **not** City of St. Louis data: it is federal survey data published by the U.S. Census Bureau, extracted for St. Louis city (FIPS 29510) from the ACS table-based Summary File and joined to the Bureau's 2024 cartographic boundary geometries (1:500,000 scale, clipped to the Mississippi shoreline — TIGER/Line extends block groups into the river channel). It is included to show how a city catalog can blend federal demographic context alongside the city's own data. Explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/demographics/acs-block-groups/collection.json)."
