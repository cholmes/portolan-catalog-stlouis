title: "ACS Demographics — Tracts"
description: "Indicators the U.S. Census Bureau publishes only at census-tract level — health insurance coverage, disability, nativity, group-quarters population, and race-iterated income and poverty — for all 104 census tracts in the City of St. Louis, from the American Community Survey (ACS) 2020–2024 5-year estimates. The Census Bureau describes the ACS as \"an ongoing survey that provides vital information on a yearly basis about our nation and its people.\" The companion `acs-block-groups` collection carries the finer-grained indicators; this collection exists because tables like B27001 (health insurance), B18101 (disability), B05002 (nativity), B26001 (group quarters) and the race-iterated B19013B/B17020B have no block-group release. Population and median household income are repeated here as more statistically stable tract-level variants. Every estimate ships with its 90%-confidence margin of error (`*_moe`) and headline rates with a coefficient of variation (`*_cv`); jam values are nulls; each column's description names its ACS table.

Unlike the city's own datasets in this catalog, this is **not** City of St. Louis data: it is federal survey data published by the U.S. Census Bureau, extracted for St. Louis city (FIPS 29510) from the ACS table-based Summary File and joined to the Bureau's 2024 cartographic boundary geometries (1:500,000 scale, clipped to the Mississippi shoreline). Explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/demographics/acs-tracts/collection.json)."
