license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=5"
attribution: "City of St. Louis — Neighborhood Stabilization / CSB"
source_url: "https://www.stlouis-mo.gov/data/upload/data-files/csb.zip"
keywords: [st-louis, missouri, open-data, csb, 311, requests]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=5).
  Source: https://www.stlouis-mo.gov/data/upload/data-files/csb.zip (portal download),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
