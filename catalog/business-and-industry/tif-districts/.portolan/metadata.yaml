title: "Tax Increment Financing (TIF) Districts"
description: "Tax Increment Financing is a development tool designed to help finance certain eligible improvements to property in designated redevelopment areas (TIF Districts) by utilizing the new, or incremental, tax revenues generated by the project after completion. For more info, contact Andrew Knop: knopa@stlouis-mo.gov Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=56); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/business-and-industry/tif-districts/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=56"
attribution: "City of St. Louis — St. Louis Development Corporation"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/TIF_Districts/FeatureServer"
keywords: [st-louis, missouri, open-data, tif, districts]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=56). Nothing was added to the data and no features were dropped except where noted below.

  Extracted from the city's own ArcGIS REST service with the Portolan CLI:

      portolan extract arcgis \
        https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/TIF_Districts/FeatureServer --layers "Districts TIF" --raw

  That pages the service's `/query` endpoint for every feature, so this is the whole layer rather than the display-capped sample a browser request returns, and it carries across the service's field aliases. The service's own ESRI renderer was captured at the same time and is republished here as `styles/city-renderer.json`, so the map can be drawn in the city's own symbology.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.

  The city's own file(s) are published as `source` assets on this collection, linked directly to stlouis-mo.gov — this mirror never becomes the only way to reach the original.
examples:
  - engine: duckdb
    description: "Count rows by Incentive_Status, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Incentive_Status, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/business-and-industry/tif-districts/tif-districts.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
