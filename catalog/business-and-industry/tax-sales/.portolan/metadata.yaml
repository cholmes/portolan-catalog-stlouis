title: "Tax Sales"
description: "Tax sale parcels from SLDC. Mirrored from [the city's open data portal](https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/Tax_Sales/FeatureServer); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/business-and-industry/tax-sales/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/Tax_Sales/FeatureServer"
attribution: "City of St. Louis — St. Louis Development Corporation"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/Tax_Sales/FeatureServer"
keywords: [st-louis, missouri, open-data, tax, sales]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/Tax_Sales/FeatureServer). Nothing was added to the data and no features were dropped except where noted below.

  Extracted from the city's own ArcGIS REST service with the Portolan CLI:

      portolan extract arcgis \
        https://maps8.stlouis-mo.gov/arcgis/rest/services/SLDC/Tax_Sales/FeatureServer --layers "Tax Sales" --raw

  That pages the service's `/query` endpoint for every feature, so this is the whole layer rather than the display-capped sample a browser request returns, and it carries across the service's field aliases. The service's own ESRI renderer was captured at the same time and is republished here as `styles/city-renderer.json`, so the map can be drawn in the city's own symbology.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/business-and-industry/tax-sales/tax-sales.parquet' LIMIT 5;
