title: "Special Business Districts (SBDs)"
description: "Special business districts (SBDs) within the City of Saint Louis. SBDs are established by Missouri statute. More Info: [http://revisor.mo.gov/main/OneChapter.aspx?chapter=67](http://revisor.mo.gov/main/OneChapter.aspx?chapter=67) Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=62); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/business-and-industry/special-business-districts/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=62"
attribution: "City of St. Louis — St. Louis Development Corporation"
source_url: "https://static.stlouis-mo.gov/open-data/SLDC/TAXING-DISTRICTS/SBD/STLSBDs_Shapefile.zip"
keywords: [st-louis, missouri, open-data, special, business, districts]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=62). Nothing was added to the data and no features were dropped except where noted below.

  Downloaded from the city's portal: https://static.stlouis-mo.gov/open-data/SLDC/TAXING-DISTRICTS/SBD/STLSBDs_Shapefile.zip (zipped Shapefile).

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.

  The city's own file(s) are published as `source` assets on this collection, linked directly to stlouis-mo.gov — this mirror never becomes the only way to reach the original.
examples:
  - engine: duckdb
    description: "Count rows by Active, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Active, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/business-and-industry/special-business-districts/special-business-districts.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
