title: "Special Business Districts (SBDs)"
description: "Special business districts (SBDs) within the City of Saint Louis. SBDs are established by Missouri statute. More Info: http://revisor.mo.gov/main/OneChapter.aspx?chapter=67 Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=62); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/development/special-business-districts/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=62"
attribution: "City of St. Louis — St. Louis Development Corporation"
source_url: "https://static.stlouis-mo.gov/open-data/SLDC/TAXING-DISTRICTS/SBD/STLSBDs_Shapefile.zip"
keywords: [st-louis, missouri, open-data, special, business, districts]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=62).
  Source: https://static.stlouis-mo.gov/open-data/SLDC/TAXING-DISTRICTS/SBD/STLSBDs_Shapefile.zip (portal download),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by Active, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Active, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/development/special-business-districts/special-business-districts.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
