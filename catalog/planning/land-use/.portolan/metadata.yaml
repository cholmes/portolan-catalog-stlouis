title: "Strategic Land Use Plan"
description: "Strategic land use (SLUP),parcel, and zoning data Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=78); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/planning/land-use/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=78"
attribution: "City of St. Louis — Planning and Urban Design"
source_url: "https://services6.arcgis.com/HZXbCkpCSqbGd0vK/arcgis/rest/services/Strategic_Land_Use_Plan/FeatureServer"
keywords: [st-louis, missouri, open-data, land, use]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=78).
  Source: https://services6.arcgis.com/HZXbCkpCSqbGd0vK/arcgis/rest/services/Strategic_Land_Use_Plan/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by SLUP_LATES, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT SLUP_LATES, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/planning/land-use/land-use.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
