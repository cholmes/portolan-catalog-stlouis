title: "Ward Boundaries (2010)"
description: "Boundaries of City of St. Louis wards Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=131); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/planning/wards-2010/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=131"
attribution: "City of St. Louis — Planning and Urban Design"
source_url: "https://static.stlouis-mo.gov/open-data/planning/wards/wards_2010.zip"
keywords: [st-louis, missouri, open-data, wards, 2010]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=131).
  Source: https://static.stlouis-mo.gov/open-data/planning/wards/wards_2010.zip (portal download),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/planning/wards-2010/wards-2010.parquet' LIMIT 5;
