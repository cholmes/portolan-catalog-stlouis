title: "Historic Landmarks"
description: "Historic sites and landmarks from the city's Historic Landmarks map service. Mirrored from [the city's open data portal](https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Landmarks/FeatureServer); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/planning/historic-landmarks/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Landmarks/FeatureServer"
attribution: "City of St. Louis — Planning and Urban Design"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Landmarks/FeatureServer"
keywords: [st-louis, missouri, open-data, historic, landmarks]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Landmarks/FeatureServer).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Landmarks/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by SITE_TYPE, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT SITE_TYPE, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/planning/historic-landmarks/historic-landmarks.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
