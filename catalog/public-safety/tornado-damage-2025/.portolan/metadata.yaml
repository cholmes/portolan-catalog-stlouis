title: "May 2025 Tornado Damage"
description: "NWS/NOAA damage assessment data for the May 2025 St. Louis tornado, with Prop NS property stabilization and sales status. Mirrored from [the city's open data portal](https://stlcity.maps.arcgis.com/home/item.html?id=d2f73ad3cd2b434b91c6eacaef94df32); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/public-safety/tornado-damage-2025/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://stlcity.maps.arcgis.com/home/item.html?id=d2f73ad3cd2b434b91c6eacaef94df32"
attribution: "City of St. Louis — City Emergency Management Agency"
source_url: "https://services6.arcgis.com/HZXbCkpCSqbGd0vK/arcgis/rest/services/NS_Tornado_Map_WFL1/FeatureServer"
keywords: [st-louis, missouri, open-data, tornado, damage, 2025]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://stlcity.maps.arcgis.com/home/item.html?id=d2f73ad3cd2b434b91c6eacaef94df32).
  Source: https://services6.arcgis.com/HZXbCkpCSqbGd0vK/arcgis/rest/services/NS_Tornado_Map_WFL1/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by efscale, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT efscale, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/public-safety/tornado-damage-2025/tornado-damage-2025.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
