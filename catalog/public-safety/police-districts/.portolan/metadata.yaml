title: "Police District Boundaries"
description: "GIS data for police district boundaries Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=83); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/public-safety/police-districts/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=83"
attribution: "City of St. Louis — Police Department"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/POLICE_DISTRICT/FeatureServer"
keywords: [st-louis, missouri, open-data, police, districts]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=83).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/POLICE_DISTRICT/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/public-safety/police-districts/police-districts.parquet' LIMIT 5;
