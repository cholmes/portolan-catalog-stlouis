title: "Occupancy Permits"
description: "Commercial, industrial, and occupancy building permits in the City of St. Louis Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=6); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/building/occupancy-permits/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=6"
attribution: "City of St. Louis — Building Commissioner"
source_url: "https://www.stlouis-mo.gov/data/upload/data-files/occupancy-permits.zip"
keywords: [st-louis, missouri, open-data, occupancy, permits]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=6).
  Source: https://www.stlouis-mo.gov/data/upload/data-files/occupancy-permits.zip (portal download),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by APPTYPE, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT APPTYPE, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/building/occupancy-permits/occupancy-permits.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
