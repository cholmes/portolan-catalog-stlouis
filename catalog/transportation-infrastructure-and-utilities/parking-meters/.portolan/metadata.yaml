title: "Parking Meters"
description: "Parking meters from the Streets Division parking services map. Mirrored from [the city's open data portal](https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/ParkingServices/MapServer); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/transportation-infrastructure-and-utilities/parking-meters/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/ParkingServices/MapServer"
attribution: "City of St. Louis — Streets - Director's Office"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/ParkingServices/MapServer"
keywords: [st-louis, missouri, open-data, parking, meters]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/ParkingServices/MapServer).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/ParkingServices/MapServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/transportation-infrastructure-and-utilities/parking-meters/parking-meters.parquet' LIMIT 5;
