title: "Bike Infrastructure"
description: "Bicycle infrastructure from the city's Biking Infrastructure Map service: existing bike facilities by type, the Brickline Greenway and Hodiamont Trail, park paths, multi-use paths, and planned and funded major bike facility projects. Mirrored from [the city's open data portal](https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Biking_Infrastructure_Map/MapServer); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/transportation-infrastructure-and-utilities/bike-infrastructure/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Biking_Infrastructure_Map/MapServer"
attribution: "City of St. Louis — Planning and Urban Design"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Biking_Infrastructure_Map/MapServer"
keywords: [st-louis, missouri, open-data, bike, infrastructure]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Biking_Infrastructure_Map/MapServer).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Biking_Infrastructure_Map/MapServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/transportation-infrastructure-and-utilities/bike-infrastructure/bike-infrastructure.parquet' LIMIT 5;
