title: "Street Sweeping Schedule"
description: "Street sweeping area schedules from the Streets Division. Mirrored from [the city's open data portal](https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/Street_Sweeping/MapServer); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/transportation-infrastructure-and-utilities/street-sweeping/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/Street_Sweeping/MapServer"
attribution: "City of St. Louis — Streets - Street Division"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/Street_Sweeping/MapServer"
keywords: [st-louis, missouri, open-data, street, sweeping]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/Street_Sweeping/MapServer).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/STREETS/Street_Sweeping/MapServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by Day_Wk, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Day_Wk, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/transportation-infrastructure-and-utilities/street-sweeping/street-sweeping.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
