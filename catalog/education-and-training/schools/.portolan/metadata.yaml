title: "City Public Schools"
description: "City of St. Louis public school information including school name, school address, grades, and ages. Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=125); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/education-and-training/schools/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=125"
attribution: "City of St. Louis — Planning and Urban Design"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Schools/FeatureServer"
keywords: [st-louis, missouri, open-data, schools]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=125).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Schools/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/education-and-training/schools/schools.parquet' LIMIT 5;
