title: "Polling Centers"
description: "Polling Centers Mirrored from [the city's open data portal](https://stlcity.maps.arcgis.com/home/item.html?id=87bc5cf8db58428295792e690397ed75); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/elections/polling-places/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://stlcity.maps.arcgis.com/home/item.html?id=87bc5cf8db58428295792e690397ed75"
attribution: "City of St. Louis — Board of Election Commissioners"
source_url: "https://services6.arcgis.com/HZXbCkpCSqbGd0vK/arcgis/rest/services/Polling_Centers_WFL1/FeatureServer"
keywords: [st-louis, missouri, open-data, polling, places]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://stlcity.maps.arcgis.com/home/item.html?id=87bc5cf8db58428295792e690397ed75).
  Source: https://services6.arcgis.com/HZXbCkpCSqbGd0vK/arcgis/rest/services/Polling_Centers_WFL1/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by Early_Voting_Available, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Early_Voting_Available, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/elections/polling-places/polling-places.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
