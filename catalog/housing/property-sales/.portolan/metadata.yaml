title: "Property Sales"
description: "Dataset describes real estate sale prices for recent property sales in the city. A separate table describes codes for different type of sales. Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=31); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/housing/property-sales/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=31"
attribution: "City of St. Louis — Assessor's Office"
source_url: "https://www.stlouis-mo.gov/data/upload/data-files/prclsale.zip"
keywords: [st-louis, missouri, open-data, property, sales]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=31).
  Source: https://www.stlouis-mo.gov/data/upload/data-files/prclsale.zip (portal download),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by SaleTypeDescr, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT SaleTypeDescr, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/housing/property-sales/property-sales.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
