title: "Occupancy Permits"
description: "Commercial, industrial, and occupancy building permits in the City of St. Louis Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=6); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/housing/occupancy-permits/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=6"
attribution: "City of St. Louis — Building Commissioner"
source_url: "https://www.stlouis-mo.gov/data/upload/data-files/occupancy-permits.zip"
keywords: [st-louis, missouri, open-data, occupancy, permits]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=6). Nothing was added to the data and no features were dropped except where noted below.

  Downloaded from the city's portal: https://www.stlouis-mo.gov/data/upload/data-files/occupancy-permits.zip (zipped CSV).

  Converted to Parquet with gpio (zstd), keeping the source's own columns. The city publishes this without geometry, so it stays that way here.

  The map layer is a derived product: the PMTiles were built by actually running the documented join against the `parcels` collection on parcel handle, so the data can be mapped without anyone having to run the join first. The Parquet is unjoined. The exact query is in AGENTS.md.

  The city's own file(s) are published as `source` assets on this collection, linked directly to stlouis-mo.gov — this mirror never becomes the only way to reach the original.
examples:
  - engine: duckdb
    description: "Count rows by APPTYPE, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT APPTYPE, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/housing/occupancy-permits/occupancy-permits.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
