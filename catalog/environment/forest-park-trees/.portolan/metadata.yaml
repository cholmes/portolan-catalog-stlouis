title: "Forest Park Trees"
description: "Forest Park Trees data Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=123); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/environment/forest-park-trees/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=123"
attribution: "City of St. Louis — Forestry"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/FORESTRY/FOREST_PARK_TREES/FeatureServer"
keywords: [st-louis, missouri, open-data, forest, park, trees]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=123).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/FORESTRY/FOREST_PARK_TREES/FeatureServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by Condition, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Condition, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/environment/forest-park-trees/forest-park-trees.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
