title: "Forest Park Trees"
description: "Forest Park Trees data Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=123); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/environment/forest-park-trees/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=123"
attribution: "City of St. Louis — Forestry"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/FORESTRY/FOREST_PARK_TREES/FeatureServer"
keywords: [st-louis, missouri, open-data, forest, park, trees]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=123). Nothing was added to the data and no features were dropped except where noted below.

  Extracted from the city's own ArcGIS REST service with the Portolan CLI:

      portolan extract arcgis \
        https://maps8.stlouis-mo.gov/arcgis/rest/services/FORESTRY/FOREST_PARK_TREES/FeatureServer --layers "FOREST_PARK_TREES" --raw

  That pages the service's `/query` endpoint for every feature, so this is the whole layer rather than the display-capped sample a browser request returns, and it carries across the service's field aliases. The service's own ESRI renderer was captured at the same time and is republished here as `styles/city-renderer.json`, so the map can be drawn in the city's own symbology.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.
examples:
  - engine: duckdb
    description: "Count rows by Condition, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT Condition, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/environment/forest-park-trees/forest-park-trees.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
