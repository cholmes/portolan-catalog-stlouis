title: "City Trees (Planting Sites)"
description: "All mapped planting sites within the city for tree plantings managed by the Forestry Division. Street tree planting sites are re-used, while park tree sites tend not to be. This data contains vacant sites, as well. Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=121); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/environment/city-trees/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=121"
attribution: "City of St. Louis — Forestry"
source_url: "https://maps9.stlouis-mo.gov/arcgis/rest/services/FORESTRY/FORESTRY_TREES/MapServer"
keywords: [st-louis, missouri, open-data, city, trees]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=121).
  Source: https://maps9.stlouis-mo.gov/arcgis/rest/services/FORESTRY/FORESTRY_TREES/MapServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by CONDITION, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT CONDITION, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/environment/city-trees/city-trees.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
