title: "Floodplain"
description: "Floodplain areas for the City of St. Louis, from the city's Floodplain map service. Mirrored from [the city's open data portal](https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/Floodplain/MapServer); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/environment/floodplain/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/Floodplain/MapServer"
attribution: "City of St. Louis — Information Technology Services Agency"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/Floodplain/MapServer"
keywords: [st-louis, missouri, open-data, floodplain]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/Floodplain/MapServer). Nothing was added to the data and no features were dropped except where noted below.

  Extracted from the city's own ArcGIS REST service with the Portolan CLI:

      portolan extract arcgis \
        https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/Floodplain/MapServer --raw

  That pages the service's `/query` endpoint for every feature, so this is the whole layer rather than the display-capped sample a browser request returns, and it carries across the service's field aliases. The service's own ESRI renderer was captured at the same time and is republished here as `styles/city-renderer.json`, so the map can be drawn in the city's own symbology.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.
examples:
  - engine: duckdb
    description: "Count rows by FLD_ZONE, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT FLD_ZONE, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/environment/floodplain/floodplain.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
