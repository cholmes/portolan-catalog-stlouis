title: "Historic Districts"
description: "Data on St. Louis certified local historic districts Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=73); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/urban-development-and-planning/historic-districts/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=73"
attribution: "City of St. Louis — Planning and Urban Design"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Districts/MapServer"
keywords: [st-louis, missouri, open-data, historic, districts]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=73).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/PDA/Historic_Districts/MapServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Count rows by DIS_TYPE, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT DIS_TYPE, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/urban-development-and-planning/historic-districts/historic-districts.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
