title: "City Boundary"
description: "St. Louis City limits Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=67); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/urban-development-and-planning/city-boundary/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=67"
attribution: "City of St. Louis — Information Technology Services Agency"
source_url: "https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/BOUNDARIES/MapServer"
keywords: [st-louis, missouri, open-data, city, boundary]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=67).
  Source: https://maps8.stlouis-mo.gov/arcgis/rest/services/STLOUIS/BOUNDARIES/MapServer (ArcGIS REST service),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/urban-development-and-planning/city-boundary/city-boundary.parquet' LIMIT 5;
