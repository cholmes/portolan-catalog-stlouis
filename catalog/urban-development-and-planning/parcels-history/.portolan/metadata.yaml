title: "Parcels (Historical, 1997-2020)"
description: "Current and historic parcel data Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=82); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/urban-development-and-planning/parcels-history/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=82"
attribution: "City of St. Louis — Assessor's Office"
source_url: "https://www.stlouis-mo.gov/data/upload/data-files/stl_parcels_1997-2000.zip"
keywords: [st-louis, missouri, open-data, parcels, history]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=82). Nothing was added to the data and no features were dropped except where noted below.

  Downloaded from the city's portal: https://www.stlouis-mo.gov/data/upload/data-files/stl_parcels_1997-2000.zip (zipped Shapefiles).

  The five era archives were unpacked and concatenated into one collection with an added `era` column, so a parcel can be followed across the 1997-2020 series in a single query.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.

  The city's own file(s) are published as `source` assets on this collection, linked directly to stlouis-mo.gov — this mirror never becomes the only way to reach the original.
examples:
  - engine: duckdb
    description: "Count rows by era, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT era, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/urban-development-and-planning/parcels-history/parcels-history.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
