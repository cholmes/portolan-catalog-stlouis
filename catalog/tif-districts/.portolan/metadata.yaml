title: "Tax Increment Financing (TIF) Districts"
description: "Tax Increment Financing is a development tool designed to help finance certain eligible improvements to property in designated redevelopment areas (TIF Districts) by utilizing the new, or incremental, tax revenues generated by the project after completion. For more info, contact Andrew Knop: knopa@stlouis-mo.gov"
