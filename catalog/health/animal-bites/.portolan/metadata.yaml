title: "Animal Bites"
description: "Animal bite reports made to the City of Saint Louis Department of Health and its Animal Care and Control section. Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=130); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/health/animal-bites/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=130"
attribution: "City of St. Louis — Environmental Health Services"
source_url: "https://static.stlouis-mo.gov/open-data/HEALTH/ANIMAL-CONTROL/ANIMAL_BITES.csv"
keywords: [st-louis, missouri, open-data, animal, bites]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=130). Nothing was added to the data and no features were dropped except where noted below.

  Downloaded from the city's portal: https://static.stlouis-mo.gov/open-data/HEALTH/ANIMAL-CONTROL/ANIMAL_BITES.csv (CSV).

  The city geocodes these to addresses; a handful land well outside the city, so points were clipped to the city boundary with a small buffer.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.

  The city's own file(s) are published as `source` assets on this collection, linked directly to stlouis-mo.gov — this mirror never becomes the only way to reach the original.
examples:
  - engine: duckdb
    description: "Count rows by ANIMAL_TYPE, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT ANIMAL_TYPE, count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/health/animal-bites/animal-bites.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
