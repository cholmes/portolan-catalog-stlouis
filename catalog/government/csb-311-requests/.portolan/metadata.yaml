title: "CSB Service Requests (311)"
description: "The Citizens' Service Bureau (CSB) is the customer service department for the City of St. Louis. This dataset provides access to some of the data collected when services are requested. The X/Y coordinates are in WGS 84 Web Mercator (EPSG:3857). File new service request here: [https://www.stlouis-mo.gov/government/departments/public-safety/neighborhood-stabilization-office/citizens-service-bureau/csb-request-submit.cfm](https://www.stlouis-mo.gov/government/departments/public-safety/neighborhood-stabilization-office/citizens-service-bureau/csb-request-submit.cfm) Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=5); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/government/csb-311-requests/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=5"
attribution: "City of St. Louis — Neighborhood Stabilization / CSB"
source_url: "https://www.stlouis-mo.gov/data/upload/data-files/csb.zip"
keywords: [st-louis, missouri, open-data, csb, 311, requests]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=5). Nothing was added to the data and no features were dropped except where noted below.

  Downloaded from the city's portal: https://www.stlouis-mo.gov/data/upload/data-files/csb.zip (zipped CSVs, one per year).

  The yearly CSVs arrive in mixed UTF-8 and Windows-1252 and were normalized to UTF-8. Coordinates come as Web Mercator `SRX`/`SRY` columns and were reprojected to EPSG:4326; points falling outside the city were set to null rather than dropped, and the roughly 18,000 requests with no coordinates at all are kept as null-geometry rows so the counts still match the city's.

  Converted to GeoParquet with gpio — zstd compression, Hilbert row order, and a covering bbox column with row-group statistics, so a spatial filter can skip most of the file over the network — and tiled to PMTiles with tippecanoe.

  The city's own file(s) are published as `source` assets on this collection, linked directly to stlouis-mo.gov — this mirror never becomes the only way to reach the original.
examples:
  - engine: duckdb
    description: "Count rows by GROUP, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT "GROUP", count(*) AS n
      FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/government/csb-311-requests/csb-311-requests.parquet'
      GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
