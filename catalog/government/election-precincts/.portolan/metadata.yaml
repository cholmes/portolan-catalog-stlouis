title: "Election Wards & Precincts"
description: "Wards & current election precincts for the City of St. Louis. Mirrored from [the city's open data portal](https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=124); explore it in the [St. Louis data browser](https://cholmes.github.io/stlouis-data-browser/#/government/election-precincts/collection.json)."
contact:
  name: "Chris Holmes"
  email: "cholmes@9eo.org"
license: "other"
license_url: "https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=124"
attribution: "City of St. Louis — Board of Election Commissioners"
source_url: "https://static.stlouis-mo.gov/open-data/BOEC/Precincts_Current.zip"
keywords: [st-louis, missouri, open-data, election, precincts]
processing_notes: |
  Mirrored from the City of St. Louis open data portal (https://www.stlouis-mo.gov/data/datasets/dataset.cfm?id=124).
  Source: https://static.stlouis-mo.gov/open-data/BOEC/Precincts_Current.zip (portal download),
  converted to GeoParquet (zstd, spatially ordered, covering bbox) and PMTiles.
examples:
  - engine: duckdb
    description: "Preview the first rows, straight off the published file"
    code: |
      INSTALL httpfs; LOAD httpfs;
      SELECT * FROM 'https://data.source.coop/tge-labs/st-louis-open-data-mirror/government/election-precincts/election-precincts.parquet' LIMIT 5;
